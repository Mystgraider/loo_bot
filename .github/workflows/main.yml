name: Daily Lotto Analysis

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-analyze-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape latest PCSO results
        run: python scraper.py

      - name: Commit updated data (kung may bago)
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "Walang bagong draws, skip commit."
          else
            git add data/
            git commit -m "chore: update draw results $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Run analysis
        run: python predict.py

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Upload results.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotto-results
          path: results.json
