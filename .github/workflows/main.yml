name: Daily Lotto Analysis

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-lotto-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-analyze-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Scrape, validate, and canonicalize draw data
        run: python scraper.py

      - name: Commit validated draw data
        run: |
          git config user.name "lotto-bot"
          git config user.email "lotto-bot@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git add data/
            git commit -m "chore: update draw results $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Run analysis
        run: python predict.py

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Upload results.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotto-results
          path: results.json
          if-no-files-found: warn
